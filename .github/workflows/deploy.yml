name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 支持在 Actions 页面手动触发一次部署
  workflow_dispatch:

# 只申请必要权限：读仓库、写 Pages、用 id-token 完成部署鉴权
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一个 Pages 发布任务，避免并发部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS，满足 Vite 5 的 Node ^18 || >=20 要求
          node-version: '22'
          cache: 'npm'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动在仓库设置里开启 GitHub Pages（Source 设为 GitHub Actions）
          # 若该步骤因权限失败，可在 Settings → Pages 手动把 Source 切为 GitHub Actions
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
